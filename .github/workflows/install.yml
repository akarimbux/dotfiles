name: Install and test

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      TEST_BRANCH: ${{ github.head_ref || github.ref_name }}
      REPO_URL: ${{ github.event.pull_request.head.repo.clone_url || format('{0}/{1}.git', github.server_url, github.repository) }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Pull and install in an isolated home
        shell: bash
        run: |
          set -euo pipefail
          checkout_dir="$RUNNER_TEMP/dotfiles checkout"
          test_home=$(mktemp -d)
          git clone --branch "$TEST_BRANCH" --single-branch "$REPO_URL" "$checkout_dir"
          cd "$checkout_dir"
          git pull --ff-only
          env HOME="$test_home" ZDOTDIR="$test_home" bash install.sh --with-tools
          bash -n install.sh
          bash -n configs/dothelp.sh
          zsh -n configs/.zshrc
          env HOME="$test_home" python3 -m unittest discover -s tests
          cd "$RUNNER_TEMP"
          env HOME="$test_home" ZDOTDIR="$test_home" zsh -ic 'dothelp python' > topic.md
          grep -q '## Python without the fuss' topic.md
          glow -s dark topic.md > rendered.txt
          test -s rendered.txt
          env HOME="$test_home" ZDOTDIR="$test_home" zsh -ic 'command -v uv; command -v fzf; command -v glow'
          env HOME="$test_home" ZDOTDIR="$test_home" bash "$checkout_dir/install.sh"
