name: Install and test

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      TEST_BRANCH: ${{ github.head_ref || github.ref_name }}
      REPO_URL: ${{ github.event.pull_request.head.repo.clone_url || format('{0}/{1}.git', github.server_url, github.repository) }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      # The config initializes completion; skip Ubuntu's duplicate global init.
      skip_global_compinit: '1'
    steps:
      - name: Pull and install in an isolated home
        shell: bash
        run: |
          set -euo pipefail
          checkout_dir="$RUNNER_TEMP/dotfiles checkout"
          test_home=$(mktemp -d)
          git clone --branch "$TEST_BRANCH" --single-branch "$REPO_URL" "$checkout_dir"
          cd "$checkout_dir"
          git pull --ff-only
          env HOME="$test_home" ZDOTDIR="$test_home" bash install.sh --with-tools
          # Include uv installed into the temporary home on Linux.
          PATH="$test_home/.local/bin:$PATH" ./check.sh
